name: Build One UI 7 for S10 Lite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    - name: Free disk space aggressively
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/lib/android /opt/microsoft /opt/mssql-tools /opt/pipx /usr/share/java /usr/share/gradle-*
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"/{Android,CodeQL,Rust,Java,Go,Python}
        sudo docker system prune -af
        sudo apt remove --purge -y '^llvm-.*' '^dotnet-.*' '^mono-.*' '^golang-.*' '^php.*' '^mysql.*' '^postgresql.*'
        sudo apt autoremove -y
        sudo apt clean
        df -h

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk git gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 p7zip-full

    - name: Install latest repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Download blobs from Release
      uses: robinraju/release-downloader@v1.13
      with:
        repository: "georgijdokin10-netizen/oneui7-s10lite-v2"
        tag: "v1.00-blobs"
        fileName: "*.7z"
        out-file-path: "."

    - name: Extract blobs
      run: |
        mkdir -p vendor/samsung/g770f
        7z x system_blobs.7z -ovendor/samsung/g770f/system
        7z x vendor_blobs.7z -ovendor/samsung/g770f/vendor

    - name: Sync AOSP (shallow and single-thread)
      run: |
        mkdir -p ~/aosp && cd ~/aosp
        repo init -u https://android.googlesource.com/platform/manifest -b android-15.0.0_r1 --depth=1
        repo sync -c -j2 --force-sync --no-tags --no-clone-bundle

    - name: Copy device and vendor files
      run: |
        cd ~/aosp
        cp -r $GITHUB_WORKSPACE/device/samsung device/
        cp -r $GITHUB_WORKSPACE/vendor/samsung vendor/

    - name: Clone One UI 7 port
      run: |
        cd ~/aosp
        git clone --depth 1 https://github.com/ProjectGlory/glory_vendor_samsung_oneui7.git -b a15 vendor/samsung/oneui7
        git clone --depth 1 https://github.com/BlackMesa123/OneUI7_Port.git -b a15 packages/apps/OneUI7

    - name: Build super.img
      run: |
        cd ~/aosp
        source build/envsetup.sh
        lunch aosp_g770f-userdebug
        make -j2 superimage

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: super.img
        path: ~/aosp/out/target/product/g770f/super.img
