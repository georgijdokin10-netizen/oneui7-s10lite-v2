name: Build super.img (GSI + One UI 7)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"/{Android,CodeQL,Rust,Java,Go}
        sudo docker system prune -af
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y wget unzip lz4 android-sdk-libsparse-utils e2fsprogs p7zip-full

    - name: Download GSI (Android 15, arm64, AB) - TrebleDroid stable
      run: |
        wget --tries=3 --timeout=30 -O gsi.img.xz https://github.com/trebledroid/treble_build_aosp/releases/download/v2025.03.26/treble_arm64_bvS.img.xz
        if [ ! -f gsi.img.xz ]; then
          echo "First link failed, trying fallback..."
          wget --tries=3 --timeout=30 -O gsi.img.xz https://github.com/ponces/treble_build_aosp/releases/download/v2024.12.18/treble_arm64_bvS.img.xz
        fi
        unxz gsi.img.xz
        mv gsi.img system.img

    - name: Download One UI 7 Magisk module (stable)
      run: |
        wget --tries=3 --timeout=30 -O oneui7.zip https://github.com/BlackMesa123/OneUI7_Port/releases/download/v1.0/OneUI7-Magisk.zip
        if [ ! -f oneui7.zip ]; then
          echo "Fallback to ProjectGlory module..."
          wget --tries=3 --timeout=30 -O oneui7.zip https://github.com/ProjectGlory/OneUI7-MagiskModule/releases/download/v1.0/OneUI7.zip
        fi

    - name: Create minimal vendor.img
      run: |
        dd if=/dev/zero of=vendor.img bs=1M count=8
        mkfs.ext4 -F vendor.img
        mkdir -p v_mnt
        sudo mount vendor.img v_mnt
        sudo mkdir -p v_mnt/etc
        echo "ro.vendor.build.version.sdk=35" | sudo tee v_mnt/build.prop
        echo "ro.product.vendor.model=SM-G770F" | sudo tee -a v_mnt/build.prop
        sudo umount v_mnt

    - name: Inject One UI 7 module into system.img
      run: |
        mkdir -p s_mnt
        sudo mount -o loop system.img s_mnt
        sudo mkdir -p s_mnt/data/adb/modules/oneui7
        sudo unzip -q oneui7.zip -d s_mnt/data/adb/modules/oneui7
        # Cleanup unnecessary large files
        sudo rm -rf s_mnt/data/adb/modules/oneui7/system/priv-app/OneUIIntro 2>/dev/null || true
        sudo umount s_mnt

    - name: Build super.img
      run: |
        SYSTEM_SIZE=$(stat -c%s system.img)
        VENDOR_SIZE=$(stat -c%s vendor.img)
        TOTAL=$((SYSTEM_SIZE + VENDOR_SIZE + 1048576))
        lpmake --metadata-size 65536 --super-name super \
          --device super:$TOTAL \
          --group group_android:$((SYSTEM_SIZE + VENDOR_SIZE)) \
          --partition system:readonly:$SYSTEM_SIZE:group_android \
          --image system=./system.img \
          --partition vendor:readonly:$VENDOR_SIZE:group_android \
          --image vendor=./vendor.img \
          --output ./super.img

    - name: Compress super.img
      run: 7z a super.img.7z super.img

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: super.img.7z
        path: super.img.7z
