name: Build super.img (Android 15 GSI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space (aggressive)
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"/{Android,CodeQL,Rust,Java,Go}
        sudo docker system prune -af
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y wget unzip lz4 android-sdk-libsparse-utils e2fsprogs p7zip-full

    - name: Cache GSI
      id: cache-gsi
      uses: actions/cache@v4
      with:
        path: system.img
        key: gsi-android15-arm64-20250401

    - name: Download GSI (Android 15, arm64) if not cached
      if: steps.cache-gsi.outputs.cache-hit != 'true'
      run: |
        wget -O system.img.xz https://github.com/andyyan/treble_build_aosp/releases/download/v2025.04.15/treble_arm64_bvS.img.xz
        unxz system.img.xz

    - name: Create minimal vendor.img
      run: |
        dd if=/dev/zero of=vendor.img bs=1M count=2
        mkfs.ext4 -F vendor.img
        mkdir -p v_mnt
        sudo mount vendor.img v_mnt
        echo "ro.vendor.build.version.sdk=35" | sudo tee v_mnt/build.prop
        echo "ro.product.vendor.model=SM-G770F" | sudo tee -a v_mnt/build.prop
        sudo umount v_mnt

    - name: Build super.img
      run: |
        SYSTEM_SIZE=$(stat -c%s system.img)
        VENDOR_SIZE=$(stat -c%s vendor.img)
        TOTAL=$((SYSTEM_SIZE + VENDOR_SIZE + 1048576))
        lpmake --metadata-size 65536 --super-name super \
          --device super:$TOTAL \
          --group group_android:$((SYSTEM_SIZE + VENDOR_SIZE)) \
          --partition system:readonly:$SYSTEM_SIZE:group_android \
          --image system=./system.img \
          --partition vendor:readonly:$VENDOR_SIZE:group_android \
          --image vendor=./vendor.img \
          --output ./super.img

    - name: Download One UI 7 Launcher module (for later installation)
      run: |
        wget -O oneui7-launcher.zip https://github.com/Androidacy/MagiskModuleDownloads/releases/download/term/one-ui-7-launcher.zip

    - name: Upload super.img
      uses: actions/upload-artifact@v4
      with:
        name: super.img
        path: super.img

    - name: Upload One UI 7 module
      uses: actions/upload-artifact@v4
      with:
        name: oneui7-launcher.zip
        path: oneui7-launcher.zip
