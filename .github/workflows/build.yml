name: Build super.img (Android 15 GSI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"/{Android,CodeQL,Rust,Java,Go}
        sudo docker system prune -af
        df -h

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y wget unzip lz4 android-sdk-libsparse-utils e2fsprogs p7zip-full

    - name: Download Google GSI (Android 15)
      run: |
        wget -O gsi.zip https://dl.google.com/developers/android/vic/images/gsi/aosp_arm64-exp-BP11.241121.010-12780007-385447c4.zip
        unzip gsi.zip
        # Извлекаем правильный образ, который находится внутри
        if [ -f "system.img" ]; then
          mv system.img system_original.img
        else
          for f in *.img; do mv "$f" system_original.img; break; done
        fi

    - name: Create minimal vendor.img
      run: |
        dd if=/dev/zero of=vendor.img bs=1M count=2
        mkfs.ext4 -F vendor.img
        mkdir -p v_mnt
        sudo mount vendor.img v_mnt
        echo "ro.vendor.build.version.sdk=35" | sudo tee v_mnt/build.prop
        echo "ro.product.vendor.model=SM-G770F" | sudo tee -a v_mnt/build.prop
        sudo umount v_mnt

    - name: Build super.img
      run: |
        SYSTEM_SIZE=$(stat -c%s system_original.img)
        VENDOR_SIZE=$(stat -c%s vendor.img)
        TOTAL=$((SYSTEM_SIZE + VENDOR_SIZE + 1048576))
        lpmake --metadata-size 65536 --super-name super \
          --device super:$TOTAL \
          --group group_android:$((SYSTEM_SIZE + VENDOR_SIZE)) \
          --partition system:readonly:$SYSTEM_SIZE:group_android \
          --image system=./system_original.img \
          --partition vendor:readonly:$VENDOR_SIZE:group_android \
          --image vendor=./vendor.img \
          --output ./super.img

    - name: Compress super.img
      run: 7z a super.img.7z super.img

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: super.img.7z
        path: super.img.7z
