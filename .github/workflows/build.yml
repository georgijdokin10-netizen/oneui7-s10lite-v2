name: Build One UI 7 for S10 Lite

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v4

    - name: Set up environment (with 7zip)
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk git gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 repo p7zip-full

    - name: Download blobs from Release (7z)
      run: |
        wget -q https://github.com/georgijdokin10-netizen/oneui7-s10lite-v2/releases/download/v1.0-blobs/system_blobs.7z
        wget -q https://github.com/georgijdokin10-netizen/oneui7-s10lite-v2/releases/download/v1.0-blobs/vendor_blobs.7z
        mkdir -p vendor/samsung/g770f
        7z x system_blobs.7z -ovendor/samsung/g770f/system
        7z x vendor_blobs.7z -ovendor/samsung/g770f/vendor

    - name: Sync AOSP
      run: |
        mkdir -p ~/aosp && cd ~/aosp
        repo init -u https://android.googlesource.com/platform/manifest -b android-15.0.0_r1 --depth=1
        repo sync -c -j4 --force-sync --no-tags

    - name: Copy device and vendor files
      run: |
        cd ~/aosp
        cp -r $GITHUB_WORKSPACE/device/samsung device/
        cp -r $GITHUB_WORKSPACE/vendor/samsung vendor/

    - name: Clone One UI 7 port
      run: |
        cd ~/aosp
        git clone https://github.com/ProjectGlory/glory_vendor_samsung_oneui7.git -b a15 vendor/samsung/oneui7
        git clone https://github.com/BlackMesa123/OneUI7_Port.git -b a15 packages/apps/OneUI7

    - name: Build super.img
      run: |
        cd ~/aosp
        source build/envsetup.sh
        lunch aosp_g770f-userdebug
        make -j$(nproc) superimage

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: super.img
        path: ~/aosp/out/target/product/g770f/super.img
