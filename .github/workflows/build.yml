name: Build super.img (GSI + One UI 7)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies & free space
      run: |
        sudo apt update
        sudo apt install -y wget unzip lz4 android-sdk-libsparse-utils p7zip-full
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"/{Android,CodeQL,Rust}
        sudo docker system prune -af
        df -h

    - name: Download GSI (Android 15, arm64, AB)
      run: |
        wget -O gsi.img.xz https://github.com/ponces/treble_build_aosp/releases/download/v2025.07.25/treble_arm64_bvS.img.xz
        unxz gsi.img.xz
        mv gsi.img system.img

    - name: Download One UI 7 Magisk module
      run: |
        wget -O oneui7.zip https://github.com/ProjectGlory/OneUI7-MagiskModule/releases/latest/download/OneUI7.zip

    - name: Create minimal vendor.img
      run: |
        dd if=/dev/zero of=vendor.img bs=1M count=16
        mkfs.ext4 -F vendor.img
        mkdir -p vendor_mnt
        sudo mount -t ext4 vendor.img vendor_mnt
        sudo mkdir -p vendor_mnt/{etc,lib,bin}
        echo "ro.vendor.build.version.sdk=35" | sudo tee vendor_mnt/build.prop
        sudo umount vendor_mnt

    - name: Inject One UI 7 into system.img
      run: |
        mkdir -p sys_mnt
        sudo mount -t ext4 -o loop system.img sys_mnt
        sudo mkdir -p sys_mnt/data/adb/modules/oneui7
        sudo unzip -q oneui7.zip -d sys_mnt/data/adb/modules/oneui7
        sudo umount sys_mnt

    - name: Create super.img
      run: |
        export SYSTEM_SIZE=$(stat -c%s system.img)
        export VENDOR_SIZE=$(stat -c%s vendor.img)
        lpmake --metadata-size 65536 --super-name super \
          --device super:$((SYSTEM_SIZE + VENDOR_SIZE + 1048576)) \
          --group group_android:$((SYSTEM_SIZE + VENDOR_SIZE)) \
          --partition system:readonly:$SYSTEM_SIZE:group_android \
          --image system=./system.img \
          --partition vendor:readonly:$VENDOR_SIZE:group_android \
          --image vendor=./vendor.img \
          --output ./super.img

    - name: Upload super.img
      uses: actions/upload-artifact@v4
      with:
        name: super.img
        path: super.img
